<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <script>(function(){try{var t=localStorage.getItem("nihoncore_theme");if(t==="sumi")document.documentElement.classList.add("theme-sumi");}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E9EDF6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NihonCore" />
  <title>Lecke — NihonCore</title>
  <link rel="icon" type="image/png" href="../img/fav_icon_nihoncore.png" />
  <link rel="apple-touch-icon" href="../img/app_icon.png" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Sora:wght@700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
</head>
<body>

  <div class="bg-decoration"></div>

  <header class="header" id="header">
    <div class="header-inner">
      <a href="../index.html" class="logo">
        <img class="logo-mark" src="../img/logo.png" alt="" width="30" height="30" />
        <span class="logo-text">Nihon<span class="logo-accent">Core</span></span>
      </a>
      <nav class="nav module-page-nav"></nav>
      <div class="auth-buttons">
        <a href="login.html" class="btn btn-ghost">Bejelentkezés</a>
        <a href="../index.html#path" class="btn-home" title="Tanulási út" aria-label="Vissza a tanulási útra">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
      </div>
    </div>
  </header>

  <!-- A lecke szövege a js/data/course.js-ből jön (app.js: initLessonPage), a ?id= paraméter szerint. -->
  <main class="module-main lesson-main" id="lessonMain">

    <div class="helpers-bar" id="helpersBar">
      <span class="hb-label">Segítők</span>
      <div class="helpers-toggle">
        <button class="ht-btn active" data-helper="romaji" type="button">
          <span class="ht-dot"></span>Romaji
        </button>
        <button class="ht-btn active" data-helper="hu" type="button">
          <span class="ht-dot"></span>Magyar
        </button>
        <button class="ht-btn" data-helper="audio" type="button">
          <span class="ht-dot"></span>🔊 Hang
        </button>
      </div>
    </div>

    <section class="module-hero glass-panel-heavy lesson-hero" id="lessonHero">
      <div class="module-hero-icon icon-glow-teal">
        <span id="lessonNo"></span>
      </div>
      <div class="module-hero-meta">
        <div class="module-meta-row">
          <span class="badge-jlpt" id="lessonKicker"></span>
          <span class="badge-group">Magyarázat</span>
        </div>
        <h1 class="module-page-title" id="lessonTitle"></h1>
        <p class="module-page-desc" id="lessonLead"></p>
        <ul class="lp-cando" id="lessonCando" aria-label="A lecke végére"></ul>
      </div>
    </section>

    <article class="lesson-content" id="lessonContent"></article>

    <!-- Ellenőrző kör: a közös kör-keret -->
    <section class="conj-runtime hidden" id="lessonRuntime">
      <div class="pr-stats">
        <div class="pr-stat">
          <span class="pr-stat-label">Pont</span>
          <span class="pr-stat-value" id="lqScore">0</span>
        </div>
        <div class="pr-stat">
          <span class="pr-stat-label">Sorozat</span>
          <span class="pr-stat-value" id="lqStreak">0 🔥</span>
        </div>
        <button class="round-exit" id="lqExit" type="button" title="Kilépés a körből" aria-label="Kilépés a körből">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span>Kilépés</span>
        </button>
      </div>
      <div class="round-progress">
        <span class="round-progress-text" id="lqCount">Kérdés 1 / —</span>
        <div class="round-progress-bar"><div class="round-progress-fill" id="lqFill" style="width: 0%"></div></div>
      </div>

      <div class="conj-card glass-panel-heavy" id="lqCard"></div>
      <div class="conj-feedback hidden" id="lqFeedback"></div>
      <div class="conj-summary hidden" id="lqSummary"></div>
    </section>

  </main>

  <footer class="footer glass-footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <img class="logo-mark" src="../img/logo.png" alt="" width="30" height="30" />
        <span class="logo-text">Nihon<span class="logo-accent">Core</span></span>
      </div>
      <p class="footer-note">A Dekiru 1 leckéit követve · © 2026 NihonCore</p>
    </div>
  </footer>

  <script src="../js/data/core.js"></script>
  <script src="../js/data/course.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/sync.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
