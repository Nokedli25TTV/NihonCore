<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <script>(function(){try{var t=localStorage.getItem("nihoncore_theme");if(t==="sumi")document.documentElement.classList.add("theme-sumi");}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0b14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NihonCore" />
  <title>Bejelentkezés — NihonCore</title>
  <link rel="icon" type="image/png" href="../img/fav_icon_nihoncore.png" />
  <link rel="apple-touch-icon" href="../img/app_icon.png" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/auth.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@barba/core@2.10.3/dist/barba.umd.min.js"></script>
</head>
<body data-barba="wrapper">

  <!-- Background -->
  <div class="auth-bg">
    <div class="auth-circle c1"></div>
    <div class="auth-circle c2"></div>
    <div class="auth-grid"></div>
  </div>

  <!-- Back link -->
  <a href="../index.html" class="back-link">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Vissza
  </a>

  <div class="auth-layout">

    <!-- Left Panel -->
    <div class="auth-panel-left">
      <a href="../index.html" class="logo">
        <span class="logo-kanji">日</span>
        <span class="logo-text">Nihon<span class="logo-accent">Core</span></span>
      </a>
      <div class="panel-quote">
        <div class="quote-kanji">継続</div>
        <div class="quote-reading">keizoku</div>
        <p class="quote-meaning">"A kitartás a mester kulcsa."</p>
      </div>
      <div class="panel-decoration">
        <div class="deco-char char-1">日</div>
        <div class="deco-char char-2">本</div>
        <div class="deco-char char-3">語</div>
      </div>
    </div>

    <!-- Right Panel — Form -->
    <div class="auth-panel-right">
      <div class="auth-card">
        <div class="auth-card-header">
          <h1>Üdv vissza!</h1>
          <p>Jelentkezz be a fiókodba és folytasd a tanulást.</p>
        </div>

        <div class="auth-form">

          <div class="form-group">
            <label class="form-label" for="email">E-mail cím</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input
                type="email"
                id="email"
                class="form-input"
                placeholder="valaki@pelda.hu"
                autocomplete="email"
              />
            </div>
          </div>

          <div class="form-group">
            <div class="label-row">
              <label class="form-label" for="password">Jelszó</label>
              <a href="#" class="forgot-link">Elfelejtett jelszó?</a>
            </div>
            <div class="input-wrapper">
              <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <button type="button" class="toggle-pw" id="togglePw" aria-label="Jelszó megjelenítése">
                <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="form-check">
            <input type="checkbox" id="remember" class="checkbox" />
            <label for="remember" class="check-label">Emlékezz rám</label>
          </div>

          <button type="button" class="btn-submit" id="loginBtn">
            <span class="btn-text">Bejelentkezés</span>
            <span class="btn-loader hidden" id="loginLoader">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            </span>
          </button>

          <div class="divider"><span>vagy</span></div>

          <button type="button" class="btn-social btn-google" id="googleBtn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Folytatás Google-lel
          </button>

        </div>

        <p class="auth-switch">
          Még nincs fiókod?
          <a href="register.html" class="switch-link">Regisztrálj ingyen</a>
        </p>

      </div>
    </div>

  </div>

  <script src="../js/app.js"></script>
</body>
</html>
