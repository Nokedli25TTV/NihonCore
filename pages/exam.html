<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <script>(function(){try{var t=localStorage.getItem("nihoncore_theme");if(t==="sumi")document.documentElement.classList.add("theme-sumi");}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E9EDF6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NihonCore" />
  <title>Dolgozatok — NihonCore</title>
  <link rel="icon" type="image/png" href="../img/fav_icon_nihoncore.png" />
  <link rel="apple-touch-icon" href="../img/app_icon.png" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Sora:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
</head>
<body>

  <div class="bg-decoration">
    <div class="ink-circle circle-1"></div>
    <div class="ink-circle circle-2"></div>
    <div class="ink-circle circle-3"></div>
    <div class="seigaiha-pattern"></div>
  </div>

  <header class="header" id="header">
    <div class="header-inner">
      <a href="../index.html" class="logo">
        <img class="logo-mark" src="../img/logo.png" alt="" width="30" height="30" />
        <span class="logo-text">Nihon<span class="logo-accent">Core</span></span>
      </a>
      <nav class="nav module-page-nav"></nav>
      <div class="auth-buttons">
        <a href="login.html" class="btn btn-ghost">Bejelentkezés</a>
        <a href="../index.html" class="btn-home" title="Kezdőlap" aria-label="Kezdőlap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="module-main exam-main" id="examMain">

    <!-- JS tölti: a dolgozat fejléce (vagy a dolgozatok listájáé) -->
    <section class="module-hero glass-panel-heavy exam-hero" id="examHero"></section>

    <!-- JS tölti: lobbi (miből áll, beállítások, korábbi eredmények) vagy a dolgozatok listája -->
    <section class="conj-lobby glass-panel-heavy" id="examLobby"></section>

    <section class="conj-runtime hidden" id="examRuntime">
      <div class="pr-stats" id="examStats">
        <div class="pr-stat">
          <span class="pr-stat-label" id="examStat1Label">Idő</span>
          <span class="pr-stat-value" id="examStat1">–</span>
        </div>
        <div class="pr-stat">
          <span class="pr-stat-label">Kérdés</span>
          <span class="pr-stat-value" id="examStat2">–</span>
        </div>
        <button class="round-exit" id="examExit" type="button" title="Kilépés a dolgozatból">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span>Kilépés</span>
        </button>
      </div>

      <div class="round-progress">
        <span class="round-progress-text" id="examCount"></span>
        <div class="round-progress-bar"><div class="round-progress-fill" id="examFill" style="width: 0%"></div></div>
      </div>

      <div class="conj-card glass-panel-heavy" id="examCard"></div>
      <div class="conj-actions" id="examActions"></div>
      <div class="conj-feedback hidden" id="examFeedback"></div>
      <div class="conj-summary hidden" id="examSummary"></div>
    </section>

  </main>

  <footer class="footer glass-footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <img class="logo-mark" src="../img/logo.png" alt="" width="30" height="30" />
        <span class="logo-text">Nihon<span class="logo-accent">Core</span></span>
      </div>
      <p class="footer-note">Dolgozatok · © 2026 NihonCore</p>
    </div>
  </footer>

  <script src="../js/data/core.js"></script>
  <script src="../js/data/course.js"></script>
  <script src="../js/data/sentences.js"></script>
  <script src="../js/data/verbs.js"></script>
  <script src="../js/data/adjectives.js"></script>
  <script src="../js/data/grammar.js"></script>
  <!-- V16/V19: auth + sync (a Firebase SDK lazy-load, az auth.js tölti) -->
  <script src="../js/auth.js"></script>
  <script src="../js/sync.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
