<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">NihonCore</title>
  <desc id="d">Japán nyelvtan magyarul, lépésről lépésre.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2470"/>
      <stop offset="0.5" stop-color="#2F47C9"/>
      <stop offset="1" stop-color="#171D57"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8FA6FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#8FA6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F5C46E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5C46E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5FD0DC" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#5FD0DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6F8BFF"/>
      <stop offset="1" stop-color="#3048D6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE3A3"/>
      <stop offset="1" stop-color="#F5B94A"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="28"/></clipPath>
    <clipPath id="type"><rect x="150" y="196" width="0" height="40"><animate attributeName="width" from="0" to="640" dur="2.2s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/></rect></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .jp { font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', Meiryo, sans-serif; font-weight: 700; }
    .float { fill: #FFFFFF; opacity: 0.10; animation: drift 9s ease-in-out infinite; }
    .f2 { animation-duration: 11s; animation-delay: -3s; }
    .f3 { animation-duration: 13s; animation-delay: -6s; }
    .f4 { animation-duration: 10s; animation-delay: -2s; }
    .f5 { animation-duration: 12s; animation-delay: -8s; }
    .blob { animation: breathe 10s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .b2 { animation-duration: 13s; animation-delay: -4s; }
    .b3 { animation-duration: 16s; animation-delay: -7s; }
    .wave { animation: slide 14s linear infinite; }
    .wave2 { animation: slide 22s linear infinite reverse; }
    .rise { opacity: 0; animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .r2 { animation-delay: 0.25s; } .r3 { animation-delay: 1.9s; } .r4 { animation-delay: 2.1s; } .r5 { animation-delay: 2.3s; } .r6 { animation-delay: 2.5s; }
    .caret { animation: blink 1s steps(1) infinite; }
    .sun { animation: sun 6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes sun { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
    @media (prefers-reduced-motion: reduce) {
      .float, .blob, .wave, .wave2, .caret, .sun { animation: none; }
      .rise { opacity: 1; animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle class="blob" cx="150" cy="40" r="260" fill="url(#glowA)"/>
    <circle class="blob b2" cx="1090" cy="300" r="240" fill="url(#glowB)"/>
    <circle class="blob b3" cx="820" cy="10" r="200" fill="url(#glowC)"/>

    <!-- lebegő jelek -->
    <text class="jp float" x="770" y="150" font-size="150">日</text>
    <text class="jp float f2" x="930" y="240" font-size="120">本</text>
    <text class="jp float f3" x="1060" y="140" font-size="140">語</text>
    <text class="jp float f4" x="690" y="270" font-size="74">あ</text>
    <text class="jp float f5" x="1130" y="262" font-size="66">カ</text>
    <text class="jp float f2" x="880" y="86" font-size="56">を</text>
    <text class="jp float f4" x="38" y="300" font-size="60">ね</text>

    <!-- hullám -->
    <g opacity="0.16" fill="#FFFFFF">
      <path class="wave" d="M0 286 C 100 262, 200 310, 300 286 S 500 262, 600 286 S 800 310, 900 286 S 1100 262, 1200 286 S 1400 310, 1500 286 S 1700 262, 1800 286 V 340 H 0 Z"/>
    </g>
    <g opacity="0.10" fill="#FFFFFF">
      <path class="wave2" d="M-600 300 C -500 280, -400 318, -300 300 S -100 280, 0 300 S 200 318, 300 300 S 500 280, 600 300 S 800 318, 900 300 S 1100 280, 1200 300 V 340 H -600 Z"/>
    </g>

    <!-- jel: torii-kapu a felkelő nappal -->
    <g class="rise">
      <g transform="translate(64 96)">
        <rect width="72" height="72" rx="20" fill="url(#mark)"/>
        <rect width="72" height="72" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.5"/>
        <circle class="sun" cx="36" cy="18" r="6" fill="url(#gold)"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 30 Q36 24 56 30"/>
          <path d="M21 39 H51"/>
          <path d="M26 31 V56"/>
          <path d="M46 31 V56"/>
        </g>
      </g>
    </g>

    <!-- cím -->
    <g class="rise r2">
      <text class="t" x="150" y="150" font-size="68" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">Nihon<tspan fill="url(#gold)">Core</tspan></text>
    </g>

    <!-- alcím: „begépelve" -->
    <g clip-path="url(#type)">
      <text class="t" x="150" y="224" font-size="27" font-weight="600" fill="#FFFFFF" fill-opacity="0.94">Japán nyelvtan magyarul — lépésről lépésre.</text>
    </g>
    <rect class="caret" x="150" y="199" width="3" height="30" rx="1.5" fill="#FFE3A3">
      <animate attributeName="x" from="150" to="716" dur="2.2s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/>
      <animate attributeName="opacity" from="1" to="0" dur="0.4s" begin="5s" fill="freeze"/>
    </rect>

    <!-- címkék -->
    <g class="t" font-size="15" font-weight="700" fill="#FFFFFF">
      <g class="rise r3"><rect x="150" y="252" width="128" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.16"/><text x="214" y="273" text-anchor="middle">JLPT N5 → N4</text></g>
      <g class="rise r4"><rect x="288" y="252" width="98" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.16"/><text x="337" y="273" text-anchor="middle">57 lecke</text></g>
      <g class="rise r5"><rect x="396" y="252" width="150" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.16"/><text x="471" y="273" text-anchor="middle">10 gyakorló modul</text></g>
      <g class="rise r6"><rect x="556" y="252" width="134" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.16"/><text x="623" y="273" text-anchor="middle">telefonra szabva</text></g>
    </g>
  </g>
</svg>
